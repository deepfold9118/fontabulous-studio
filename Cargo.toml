[package]
name = "fontabulous_studio"
version = "0.1.0"
edition = "2021"
description = "Fontabulous Studio - a font editor, companion to the Fontabulous font manager"
license = "Apache-2.0"

[[bin]]
name = "fontabulous_studio"
path = "src/main.rs"

[dependencies]
eframe = "0.35"
egui = "0.35"
ttf-parser = "0.25"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
lyon_tessellation = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

[build-dependencies]
png = "0.18"
embed-resource = "3"
