[package]
name = "fontabulous-studio-setup"
version = "0.1.0"
edition = "2021"
description = "Fontabulous Studio installer"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
eframe = "0.35"
egui = "0.35"
png = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
mslnk = "0.1.8"

[build-dependencies]
png = "0.18"
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
